<style>
.neural-net-wrapper {
    margin: 0;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    background: var(--color-background-code, rgba(128, 128, 128, 0.05));
    border: 1px solid var(--color-border, rgba(128, 128, 128, 0.15));
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.02);
    position: relative;
    overflow: hidden;
    min-height: 260px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    display: flex;
    flex-direction: column;
}

.neural-net-wrapper:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
}

.neural-net-wrapper canvas {
    flex: 1;
    width: 100%;
    display: block;
    cursor: crosshair;
}

.nn-tooltip {
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--color-text);
    opacity: 0;
    transition: opacity 0.15s ease;
    padding: 0 1rem 0.5rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.nn-tooltip.visible {
    opacity: 1;
}
</style>

<div class="neural-net-wrapper" id="nn-container">
    <canvas id="neural-canvas"></canvas>
    <div class="nn-tooltip" id="nn-tooltip"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const canvas = document.getElementById('neural-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('nn-container');
    const tooltip = document.getElementById('nn-tooltip');

    let width = 0, height = 0;

    function resize() {
        const rect = canvas.getBoundingClientRect();
        width = rect.width || container.clientWidth;
        height = rect.height || (container.clientHeight - 28);
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', function() { resize(); initialized = false; });
    setTimeout(resize, 50);

    // Architecture: specific experiences → extracted skills → domains → current roles
    const layers = [
        {
            name: "Inputs",
            nodes: ["CS Undergrad", "IT Intern", "Housekeeper", "Shop Assistant"]
        },
        {
            name: "Skills",
            nodes: ["Python", "InfoSec", "Automation", "Linux & Ops", "Data Work"]
        },
        {
            name: "Domains",
            nodes: ["Machine Learning", "Cybersecurity", "Healthcare AI", "BJJ"]
        },
        {
            name: "Output",
            nodes: ["MSc AI Student", "Talk360", "Futurist Law Lab"]
        }
    ];

    const nodes = [];
    let layerSpacing = 0;
    let initialized = false;

    function initNodes() {
        nodes.length = 0;
        layerSpacing = width / (layers.length + 1);
        layers.forEach(function(layer, i) {
            const count = layer.nodes.length;
            const nodeSpacing = height / (count + 1);
            layer.nodes.forEach(function(label, j) {
                nodes.push({
                    x: layerSpacing * (i + 1),
                    y: nodeSpacing * (j + 1),
                    baseX: layerSpacing * (i + 1),
                    baseY: nodeSpacing * (j + 1),
                    layer: i,
                    label: label,
                    vx: 0, vy: 0
                });
            });
        });
    }

    let mouse = { x: -9999, y: -9999, active: false };

    canvas.addEventListener('mousemove', function(e) {
        const rect = canvas.getBoundingClientRect();
        mouse.x = e.clientX - rect.left;
        mouse.y = e.clientY - rect.top;
        mouse.active = true;
    });

    canvas.addEventListener('mouseleave', function() {
        mouse.active = false;
        mouse.x = -9999;
        mouse.y = -9999;
        tooltip.textContent = '';
        tooltip.classList.remove('visible');
    });

    const RADIUS = 5;
    const HOVER_RADIUS = 8;
    const REPEL_DIST = 60;
    const LABEL_DIST = 30;

    function draw() {
        if (!initialized && width > 0 && height > 0) {
            initNodes();
            initialized = true;
        }

        ctx.clearRect(0, 0, width, height);

        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const accent = '#10b981';
        const edgeIdle = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)';
        const edgeHot  = accent;
        const nodeIdle = isDark ? 'rgba(255,255,255,0.25)' : 'rgba(0,0,0,0.2)';
        const layerLabelColor = isDark ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.3)';

        // Draw layer name headers
        ctx.font = '9px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillStyle = layerLabelColor;
        layers.forEach(function(layer, i) {
            ctx.fillText(layer.name.toUpperCase(), layerSpacing * (i + 1), 4);
        });

        // Physics
        let hoveredNode = null;
        let closestDist = Infinity;

        nodes.forEach(function(node) {
            const dx = mouse.x - node.x;
            const dy = mouse.y - node.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (mouse.active && dist < REPEL_DIST) {
                const angle = Math.atan2(dy, dx);
                const force = (REPEL_DIST - dist) / REPEL_DIST;
                node.vx -= Math.cos(angle) * force * 0.6;
                node.vy -= Math.sin(angle) * force * 0.6;
            }

            node.vx += (node.baseX - node.x) * 0.05;
            node.vy += (node.baseY - node.y) * 0.05;
            node.vx *= 0.82;
            node.vy *= 0.82;
            node.x += node.vx;
            node.y += node.vy;

            if (mouse.active && dist < closestDist) {
                closestDist = dist;
                hoveredNode = node;
            }
        });

        // Update tooltip from closest node
        if (mouse.active && hoveredNode && closestDist < LABEL_DIST) {
            tooltip.textContent = hoveredNode.label;
            tooltip.classList.add('visible');
        } else if (!mouse.active) {
            tooltip.classList.remove('visible');
        } else {
            tooltip.classList.remove('visible');
        }

        // Edges
        for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
                if (nodes[j].layer !== nodes[i].layer + 1) continue;
                const ni = nodes[i], nj = nodes[j];
                const diI = Math.hypot(mouse.x - ni.x, mouse.y - ni.y);
                const diJ = Math.hypot(mouse.x - nj.x, mouse.y - nj.y);
                const hot = mouse.active && (diI < LABEL_DIST || diJ < LABEL_DIST);
                ctx.beginPath();
                ctx.moveTo(ni.x, ni.y);
                ctx.lineTo(nj.x, nj.y);
                ctx.strokeStyle = hot ? edgeHot : edgeIdle;
                ctx.lineWidth = hot ? 1.0 : 0.5;
                ctx.globalAlpha = hot ? 0.7 : 1;
                ctx.stroke();
                ctx.globalAlpha = 1;
            }
        }

        // Nodes
        nodes.forEach(function(node) {
            const dist = Math.hypot(mouse.x - node.x, mouse.y - node.y);
            const isClose = mouse.active && dist < LABEL_DIST;
            const r = isClose ? HOVER_RADIUS : RADIUS;
            ctx.beginPath();
            ctx.arc(node.x, node.y, r, 0, Math.PI * 2);
            ctx.fillStyle = isClose ? accent : nodeIdle;
            ctx.fill();
        });

        requestAnimationFrame(draw);
    }

    draw();
});
</script>
