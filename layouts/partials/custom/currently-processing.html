<style>
.currently-processing-wrapper {
    margin: 0;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    background: var(--color-background-code, rgba(128, 128, 128, 0.05));
    border: 1px solid var(--color-border, rgba(128, 128, 128, 0.15));
    border-radius: 16px;
    padding: 1.5rem;
    box-shadow: 0 4px 15px rgba(0,0,0,0.02);
    text-align: left;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.currently-processing-wrapper:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
}

.cp-header {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--color-text);
}

.cp-item {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    margin-bottom: 0.8rem;
    font-size: 0.95rem;
}

.cp-item:last-child {
    margin-bottom: 0;
}

.cp-icon {
    font-size: 1.2rem;
    min-width: 24px;
    text-align: center;
}

.cp-content {
    flex: 1;
}

.cp-label {
    font-weight: 600;
    color: var(--theme-color, #888);
    margin-right: 0.3rem;
}

.cp-value {
    opacity: 0.9;
}

</style>

<div class="currently-processing-wrapper">
    <div class="cp-header">
        <i class="fa-solid fa-microchip"></i> Currently Processing...
    </div>
    {{ range $.Site.Data.currently.items }}
    <div class="cp-item">
        <div class="cp-icon">{{ .icon }}</div>
        <div class="cp-content">
            <span class="cp-label">{{ .label }}:</span>
            <span class="cp-value">{{ .value }}</span>
        </div>
    </div>
    {{ end }}
</div>
